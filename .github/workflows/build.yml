# Pushes and PRs: type-check and bundle against dune-weaver-mobile's main
# (plus dune-weaver's patterns, which mobile's bundled library is generated from).
# Tag v<mobile version> (e.g. v1.3.0): build a signed, notarized Mac DMG and a
# Windows installer, then publish them as the GitHub Release the app's update
# check reads.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch: # re-check after mobile changes; desktop has no commit then

jobs:
  check:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { path: dune-weaver-desktop }
      - uses: actions/checkout@v7
        with: { repository: tuanchris/dune-weaver-mobile, path: dune-weaver-mobile }
      # Mobile's bundled patterns are generated (gitignored) from dune-weaver's.
      - uses: actions/checkout@v7
        with: { repository: tuanchris/dune-weaver, path: dune-weaver, sparse-checkout: patterns }
      - uses: actions/setup-node@v7
        with:
          node-version-file: dune-weaver-desktop/.nvmrc
          cache: npm
          cache-dependency-path: '*/package-lock.json'
      - run: npm run gen-geometry
        working-directory: dune-weaver-mobile
      # tsc resolves the mobile source's imports from mobile's own node_modules.
      - run: npm ci
        working-directory: dune-weaver-mobile
      - run: npm ci && npx tsc --noEmit && npm run web
        working-directory: dune-weaver-desktop

  release:
    if: github.ref_type == 'tag'
    runs-on: macos-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: dune-weaver-desktop
    steps:
      - uses: actions/checkout@v7
        with: { path: dune-weaver-desktop }
      - uses: actions/checkout@v7
        with: { repository: tuanchris/dune-weaver-mobile, path: dune-weaver-mobile }
      # Mobile's bundled patterns are generated (gitignored) from dune-weaver's.
      - uses: actions/checkout@v7
        with: { repository: tuanchris/dune-weaver, path: dune-weaver, sparse-checkout: patterns }
      - uses: actions/setup-node@v7
        with:
          node-version-file: dune-weaver-desktop/.nvmrc
          cache: npm
          cache-dependency-path: dune-weaver-desktop/package-lock.json
      - run: npm run gen-geometry
        working-directory: dune-weaver-mobile
      - name: Tag must match the bundled mobile version
        run: |
          v=$(node -p "require('../dune-weaver-mobile/app.json').expo.version")
          [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "::error::Tag is $GITHUB_REF_NAME but mobile main is $v"; exit 1; }
      - run: npm ci && npm run web
      - name: Mac (signed + notarized)
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # An unsigned Mac build opens as "damaged": never publish one.
          [ -n "$CSC_LINK" ] && [ -n "$APPLE_API_KEY_P8" ] || { echo "::error::Mac signing secrets are missing"; exit 1; }
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
          npx electron-builder --mac --publish never
      # Separate step: electron-builder falls back to CSC_LINK for Windows
      # signing, and the Apple cert must not sign the .exe.
      - name: Windows (unsigned)
        run: npx electron-builder --win --publish never
      # A moved tag (a desktop-only fix reissued under the same version) replaces
      # the existing release's installers and keeps its notes.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber release/*.dmg release/*.exe
          else
            gh release create "$GITHUB_REF_NAME" --title "Dune Weaver ${GITHUB_REF_NAME#v}" --generate-notes release/*.dmg release/*.exe
          fi
